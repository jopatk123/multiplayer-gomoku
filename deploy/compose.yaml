# 杭州运行机示例：只保留镜像、compose 与 env，不放业务源码。
# 启动：docker compose --env-file .env up -d --no-build
# 构建在新加坡完成，经 docker save / rsync / docker load 后使用下方镜像名。

services:
  gomoku:
    image: ${GOMOKU_IMAGE:-gomoku:latest}
    container_name: gomoku
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      GOMOKU_HOST: 0.0.0.0
      GOMOKU_WS_PORT: "18765"
    ports:
      - "127.0.0.1:18765:18765"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18765/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 8s
